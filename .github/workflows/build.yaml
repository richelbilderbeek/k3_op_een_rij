name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep these the same as in create_zensical_website.yaml
env:
  QT_VERSION: 6.11.1
  # Must match the Qt version, see https://doc.qt.io/qt-6/wasm.html
  EMSCRIPTEN_VERSION: 4.0.7
  WINDOWS_QT_VERSION: 6.8.3

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-multimedia-dev libgl1-mesa-dev
      - name: Build and run the tests
        run: |
          mkdir build_test
          cd build_test
          qmake6 CONFIG+=debug ../k3_op_een_rij_test.pro
          make -j4
          QT_QPA_PLATFORM=offscreen ./k3_op_een_rij_test
      - name: Build the game
        run: |
          mkdir build
          cd build
          qmake6 ../k3_op_een_rij.pro
          make -j4
      - uses: actions/upload-artifact@v4
        with:
          name: k3_op_een_rij-linux
          path: build/k3_op_een_rij

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.WINDOWS_QT_VERSION }}
          arch: win64_msvc2022_64
          modules: qtmultimedia
          cache: true
      - name: Build
        shell: cmd
        run: |
          mkdir build
          cd build
          qmake ..\k3_op_een_rij.pro
          nmake release
      - name: Bundle Qt libraries
        run: |
          mkdir dist
          copy build\release\k3_op_een_rij.exe dist
          windeployqt --release --no-translations dist\k3_op_een_rij.exe
      - uses: actions/upload-artifact@v4
        with:
          name: k3_op_een_rij-windows
          path: dist

  webassembly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        # WebAssembly Qt also needs a desktop Qt for its host tools
        run: |
          pip install aqtinstall
          aqt install-qt linux desktop "$QT_VERSION" linux_gcc_64 -O "$HOME/qt"
          aqt install-qt all_os wasm "$QT_VERSION" wasm_singlethread -O "$HOME/qt"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
      - name: Build
        run: |
          mkdir build
          cd build
          "$HOME/qt/$QT_VERSION/wasm_singlethread/bin/qmake" ../k3_op_een_rij.pro
          make -j4
      - name: Collect web files
        run: |
          mkdir dist
          cp build/*.html build/*.js build/*.wasm dist/
          cp build/*.svg dist/ || true
      - name: Smoke test in a browser
        run: |
          pip install playwright pillow
          (cd dist && python3 -m http.server 8000) &
          sleep 2
          python3 .github/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: k3_op_een_rij-webassembly
          path: dist
